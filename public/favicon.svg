<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Neon glow filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a3e635" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#a3e635" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Solid vibrant neon circle with glow -->
  <circle cx="32" cy="32" r="28" fill="#a3e635" filter="url(#neon-glow)" />

  <!-- Inner dark center dot, matching the site branding -->
  <circle cx="32" cy="32" r="8" fill="#0c0c0c" />
</svg>
